[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfwalk"
version = "0.1.0"
description = "《三角洲行动》第一人称画面可走区域语义分割（离线分析工具）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",              # torch.amp.GradScaler("cuda")
    "torchvision>=0.18",
    "segmentation-models-pytorch>=0.4",  # MODEL_ARCHITECTURES_MAPPING、Segformer 等架构
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
autolabel = ["transformers>=4.40"]
# onnx：新版 torch 的导出器本身需要它；onnxscript：legacy 导出器不可用时的 dynamo 导出器后备；
# onnxruntime：在本机校验/部署导出的模型（README 中的示例）
onnx = ["onnx>=1.15", "onnxscript>=0.1", "onnxruntime>=1.17"]
dev = [
    "pytest>=7.4",
    "transformers>=4.40",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
]

[project.scripts]
dfwalk = "dfwalk.cli:main"

[tool.setuptools.packages.find]
include = ["dfwalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
